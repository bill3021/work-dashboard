<script>
(() => {
  const root = document.querySelector('#app');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const bytes = v => Uint8Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
  const status = t => t.done ? 'done' : t.inProgress ? 'progress' : 'todo';
  const statusLabel = t => ({done:'已完成',progress:'有进展',todo:'未开始'}[status(t)]);
  let data, page = 'tasks', type = 'daily', selectedDate, month, selectedReport;
  function dates() { return data.reports.filter(r => r.type === type); }
  function chooseType(value) {
    type = value; const list = dates(); selectedReport = list[0]?.id;
    selectedDate = list[0]?.start || data.updatedAt.slice(0,10); month = selectedDate.slice(0,7);
  }
  const due = t => [t.deadline?.slice(5).replace('-','/'),t.deadlineHint].filter(Boolean).join(' ') || '未设时限';
  function tasks() {
    const quadrants = [['重要且紧急','优先处理','#faf0eb','#be8071'],['重要不紧急','安排时间','#edf3e7','#8d9e80'],['紧急不重要','协调推进','#fcf4df','#c2a15d'],['不重要不紧急','适时处理','#edf1f0','#94a3a2']];
    return '<div class="section-heading"><h2>四象限任务</h2><span class="hint">展示最近一次同步的任务安排 · 点击名称查看详情</span></div><div class="quadrants">' + quadrants.map((q,i) => {
      const list = data.tasks.filter(t => t.quadrant === i+1);
      return '<section class="quadrant" style="--tint:'+q[2]+';--accent:'+q[3]+'"><div class="qhead"><span class="qnumber">0'+(i+1)+'</span><div><h3>'+q[0]+'</h3><p>'+q[1]+'</p></div><span class="count">'+list.length+'</span></div><div class="rows">'+(list.length ? list.map(t => '<div class="task '+status(t)+'"><span class="mark" role="img" aria-label="'+statusLabel(t)+'">'+(t.done?'✓':t.inProgress?'−':'')+'</span><button class="task-title" data-task="'+esc(t.id)+'" title="'+esc(t.name)+'"><span class="task-name">'+esc(t.name)+'</span><span class="project">'+esc(t.project)+'</span></button><div class="task-meta"><span>'+esc(due(t))+'</span><span>'+esc([t.contact&&'↔ '+t.contact,t.estimate&&t.estimate+(t.unit||'小时')].filter(Boolean).join(' · '))+'</span></div></div>').join('') : '<div class="empty">此象限暂无任务</div>')+'</div></section>';
    }).join('')+'</div><div class="legend"><span><i class="mark"></i>未开始</span><span class="progress"><i class="mark">−</i>有进展</span><span class="done"><i class="mark">✓</i>已完成</span></div>';
  }
  function calendar() {
    const [year,m] = month.split('-').map(Number), offset = (new Date(Date.UTC(year,m-1,1)).getUTCDay()+6)%7, length = new Date(Date.UTC(year,m,0)).getUTCDate();
    const available = new Set(dates().map(r => r.start));
    return '<aside class="panel calendar"><div class="month-heading"><button data-month="-1" aria-label="上个月">‹</button><strong>'+year+'年'+m+'月</strong><button data-month="1" aria-label="下个月">›</button></div><div class="weekdays">'+['一','二','三','四','五','六','日'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="days">'+'<span></span>'.repeat(offset)+Array.from({length},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0');return '<button data-date="'+date+'" aria-label="'+date+(available.has(date)?' 有日报':' 暂无日报')+'" aria-pressed="'+(date===selectedDate)+'" class="'+(available.has(date)?'available':'')+'">'+(i+1)+'</button>';}).join('')+'</div><p class="calendar-hint">● 标记的日期有日报，点击日期阅读</p></aside>';
  }
  function reports() {
    const list=dates(), report=type==='daily'?list.find(r=>r.start===selectedDate):list.find(r=>r.id===selectedReport);
    const labels={daily:'日报',weekly:'周报',monthly:'月报'};
    return '<div class="type-tabs" aria-label="报告类型">'+Object.entries(labels).map(([k,v])=>'<button data-type="'+k+'" aria-pressed="'+(k===type)+'">'+v+'</button>').join('')+'</div><div class="report-layout">'+(type==='daily'?calendar():'<aside class="panel report-list">'+(list.length?list.map(r=>'<button data-report="'+esc(r.id)+'" aria-pressed="'+(r.id===selectedReport)+'">'+esc(r.start+' — '+r.end)+'</button>').join(''):'<div class="empty">暂无已确认'+labels[type]+'</div>')+'</aside>')+'<article class="panel">'+(report?'<h2 class="report-title">'+esc(report.start)+(report.end!==report.start?' — '+esc(report.end):'')+' '+labels[type]+'</h2><span class="hint">已确认版本</span><div class="report-body">'+esc(report.body)+'</div>':'<div class="report-empty">'+(type==='daily'?esc(selectedDate)+' 暂无已确认日报':'暂无已确认'+labels[type])+'</div>')+'</article></div>';
  }
  function render() {
    const updated = new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'medium',timeStyle:'short'}).format(new Date(data.updatedAt));
    root.innerHTML='<header><div class="eyebrow">WORK IN ORDER · 只读展示</div><h1>'+esc(data.owner)+'的工作看板</h1><div class="subtitle">最近同步：'+esc(updated)+'</div><nav aria-label="工作看板导航"><button data-page="tasks" aria-pressed="'+(page==='tasks')+'">四象限任务</button><button data-page="reports" aria-pressed="'+(page==='reports')+'">工作报告</button></nav></header><main>'+(page==='tasks'?tasks():reports())+'<div class="footer">内容以最近同步为准</div></main><dialog id="task-detail"></dialog>';
  }
  function detail(id) {
    const t = data.tasks.find(t=>t.id===id); if(!t)return;
    const fields=[['状态',statusLabel(t)],['所属项目',t.project],['时限',due(t)],['工作量',t.estimate&&t.estimate+(t.unit||'小时')],['对接人',t.contact],['说明',t.note]];
    const dialog=document.querySelector('#task-detail'); dialog.innerHTML='<h2>'+esc(t.name)+'</h2><dl>'+fields.map(([k,v])=>'<dt>'+k+'</dt><dd>'+esc(v||'未填写')+'</dd>').join('')+'</dl><button class="close" data-close>关闭</button>'; dialog.showModal();
  }
  async function unlock(key) {
    try {
      if(!/^[a-zA-Z0-9_-]{43}$/.test(key))throw new Error('key');
      if(!globalThis.crypto?.subtle)throw new Error('context');
      const payload=JSON.parse(document.querySelector('#encrypted-snapshot').textContent), cryptoKey=await crypto.subtle.importKey('raw',bytes(key),'AES-GCM',false,['decrypt']);
      const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},cryptoKey,bytes(payload.data));
      data=JSON.parse(new TextDecoder().decode(clear)); chooseType('daily'); render();
    } catch(error) { document.querySelector('#unlock-error').textContent=error.message==='context'?'请使用 HTTPS 网页地址打开。':'查看密钥不正确或内容已损坏，请使用最新的完整查看链接。'; }
  }
  document.addEventListener('submit',e=>{if(e.target.id==='unlock'){e.preventDefault();unlock(document.querySelector('#view-key').value.trim());}});
  document.addEventListener('click',e=>{
    const button=e.target.closest('button'); if(!button||!data)return;
    if(button.dataset.task){detail(button.dataset.task);return;}
    if(button.hasAttribute('data-close')){document.querySelector('#task-detail').close();return;}
    if(button.dataset.page)page=button.dataset.page;
    else if(button.dataset.type)chooseType(button.dataset.type);
    else if(button.dataset.date)selectedDate=button.dataset.date;
    else if(button.dataset.report)selectedReport=button.dataset.report;
    else if(button.dataset.month){const [y,m]=month.split('-').map(Number);month=new Date(Date.UTC(y,m-1+Number(button.dataset.month),1)).toISOString().slice(0,7);}
    else return;render();
  });
  const key=new URLSearchParams(location.hash.slice(1)).get('k'); if(key)unlock(key);
})();
</script></body></html>
